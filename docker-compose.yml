services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: garvhem
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - garvhem_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d garvhem"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  garvhem_pg:
